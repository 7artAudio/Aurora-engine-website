<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora Engine — Professional Audio Technology Platform</title>
  <meta name="description" content="Aurora Engine is an advanced professional audio technology platform combining processing, signal understanding, decision support, visualization, and control.">
  
  <!-- Modern Precision Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
  
  <!-- Main Styling -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-loading">

  <!-- Minimal Ambient Navigation Foundation -->
  <header class="site-header" id="site-header">
    <nav class="main-nav" aria-label="Main Navigation">
      <ul class="nav-list">
        <li class="nav-item"><a href="#aurora" class="nav-link">AURORA</a></li>
        <li class="nav-item"><a href="#experience" class="nav-link">EXPERIENCE</a></li>
        <li class="nav-item"><a href="#technology" class="nav-link">TECHNOLOGY</a></li>
        <li class="nav-item"><a href="#vision" class="nav-link">VISION</a></li>
        <li class="nav-item"><a href="#contact" class="nav-link">CONTACT</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content">
    <!-- HERO SECTION PROTOTYPE v3 R2 -->
    <section class="hero-section" id="hero">
      
      <!-- PURE BLACK ENVIRONMENT (All atmospheric halos removed) -->

      <div class="hero-container">
        <!-- Unified Hero Brand Architecture -->
        <div class="hero-lockup">
          
          <!-- Native Web SVG Arc (Precision Alignment & Left-to-Right Energy Wave) -->
          <div class="hero-arc-container">
            <svg class="hero-native-arc-svg" viewBox="0 0 800 160" preserveAspectRatio="xMidYMin meet" aria-hidden="true">
              <defs>
                <!-- 1. White/Silver Base Structural Arc Gradient -->
                <linearGradient id="arcBaseWhiteGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
                  <stop offset="10%" stop-color="#ffffff" stop-opacity="0.35" />
                  <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95" />
                  <stop offset="90%" stop-color="#ffffff" stop-opacity="0.35" />
                  <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
                </linearGradient>

                <!-- 2. Left-to-Right Moving Spectral Energy Wave Gradient (SMIL Hardware Animated) -->
                <linearGradient id="arcEnergyWaveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
                  <stop offset="25%" stop-color="#38cdf0" stop-opacity="0.90" />
                  <stop offset="42%" stop-color="#2b7fff" stop-opacity="0.95" />
                  <stop offset="58%" stop-color="#9d42f5" stop-opacity="0.95" />
                  <stop offset="75%" stop-color="#e042f5" stop-opacity="0.85" />
                  <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
                  <animateTransform 
                    attributeName="gradientTransform" 
                    type="translate" 
                    from="-800 0" 
                    to="800 0" 
                    dur="8s" 
                    repeatCount="indefinite" />
                </linearGradient>
              </defs>

              <!-- Base Precision White/Silver Arc Core (1.2px) -->
              <path d="M 40,145 Q 400,15 760,145" 
                    fill="none" 
                    stroke="url(#arcBaseWhiteGradient)" 
                    stroke-width="1.2" 
                    stroke-linecap="round" />

              <!-- Traveling Left-to-Right Auroral Energy Wave (1.5px) -->
              <path d="M 40,145 Q 400,15 760,145" 
                    fill="none" 
                    stroke="url(#arcEnergyWaveGradient)" 
                    stroke-width="1.5" 
                    stroke-linecap="round" />
            </svg>
          </div>

          <!-- Official LOGO AURORA HD Derived Transparent Asset -->
          <div class="hero-logo-wrapper">
            <img 
              src="assets/logo/aurora-engine-logo-hd-transparent.png" 
              alt="Aurora Engine" 
              class="hero-logo-img"
              width="3730" 
              height="667"
              loading="eager"
              fetchpriority="high"
            >
          </div>

          <!-- Conceptual Brand Signature -->
          <div class="hero-signature-block" id="hero-signature">
            <div class="signature-line" aria-label="Analyze, Understand, Decide, Apply">
              <span class="sig-word">ANALYZE</span>
              <span class="sig-dot" aria-hidden="true">·</span>
              <span class="sig-word">UNDERSTAND</span>
              <span class="sig-dot" aria-hidden="true">·</span>
              <span class="sig-word">DECIDE</span>
              <span class="sig-dot" aria-hidden="true">·</span>
              <span class="sig-word">APPLY</span>
            </div>
          </div>

          <!-- STAY TUNED -->
          <div class="hero-stay-tuned" id="hero-stay-tuned">
            <span class="stay-tuned-text">STAY TUNED</span>
          </div>

        </div>

        <!-- Minimal Continuation Indicator Line -->
        <div class="hero-scroll-indicator" id="scroll-indicator">
          <a href="#aurora" class="scroll-link" aria-label="Scroll to continue">
            <div class="scroll-line-wrap">
              <span class="scroll-line"></span>
            </div>
          </a>
        </div>
      </div>
    </section>

    <!-- Transition Target Anchor for Future Section 02 -->
    <div id="aurora" class="section-transition-anchor" aria-hidden="true"></div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
